name: Daily Morning Push Ping Trigger

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  send-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install web-push

      - name: Execute Daily Push Script
        run: node scripts/daily-ping.js
