name: Daily Morning Push Ping Trigger

on:
  schedule:
    # Runs at 08:00 AM UTC (11:00 AM Local) every day
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual 1-click trigger in GitHub Actions UI anytime!

jobs:
  send-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install web-push

      - name: Execute Daily Push Script
        env:
          IPHONE_PUSH_TOKEN: ${{ secrets.IPHONE_PUSH_TOKEN }}
        run: node scripts/daily-ping.js
