<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Adaptive Coach - Personal AI Fitness Agent</title>

  <!-- Synchronous Initial Viewport Height Calculator for iOS PWA Launch -->
  <script>
    (function() {
      function setAppHeight() {
        var h = window.innerHeight;
        document.documentElement.style.setProperty('--app-height', h + 'px');
      }
      window.addEventListener('resize', setAppHeight);
      window.addEventListener('orientationchange', setAppHeight);
      setAppHeight();
    })();
  </script>

  <!-- PWA & iOS Meta Tags -->
  <link rel="manifest" href="manifest.json?v=23" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Adaptive Coach" />

  <!-- Icons -->
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Core Mobile-First CSS -->
  <link rel="stylesheet" href="css/styles.css?v=23" />
</head>
<body>
  <div id="app" class="app-container">
    <!-- Bare-Bones Clean Header -->
    <header class="app-header glassmorphism">
      <div class="header-brand">
        <span class="brand-logo">🏃‍♂️</span>
        <div>
          <h1 class="brand-title">Adaptive Coach</h1>
          <span class="brand-subtitle">Gemini AI Dynamic Recovery</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn btn-outline btn-sm" id="hdr-settings-btn">🔑 Key & Settings</button>
      </div>
    </header>

    <!-- Dynamic Main Content Container -->
    <main id="main-view" class="main-content">
      <div class="loading-state" style="text-align: center; padding: 40px 0;">
        <div class="spinner" style="margin: 0 auto 16px auto;"></div>
        <p>Loading Adaptive Fitness Agent...</p>
      </div>
    </main>

    <!-- Bare-Bones 2-Tab Navigation Bar -->
    <nav class="app-nav glassmorphism">
      <button class="tab-btn active" data-tab="chat">
        <span class="nav-icon">💬</span>
        <span class="nav-label">Coach Chat</span>
      </button>
      <button class="tab-btn" data-tab="plan">
        <span class="nav-icon">🏋️</span>
        <span class="nav-label">Today's Plan</span>
      </button>
    </nav>
  </div>

  <!-- Settings Modal Shell -->
  <div id="modal-container"></div>

  <!-- Application Entry Point -->
  <script type="module" src="js/app.js?v=23"></script>
</body>
</html>
