<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Adaptive Coach - Personal AI Fitness & Recovery Agent</title>

  <!-- PWA & iOS Meta Tags -->
  <link rel="manifest" href="manifest.json?v=5" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Adaptive Coach" />

  <!-- Icons -->
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Core CSS -->
  <link rel="stylesheet" href="css/styles.css?v=5" />
</head>
<body>
  <div id="app" class="app-container">
    <!-- Header Component -->
    <header class="app-header glassmorphism">
      <div class="header-brand">
        <span class="brand-logo">🏃‍♂️</span>
        <div>
          <h1 class="brand-title">Adaptive Coach</h1>
          <span class="brand-subtitle">Gemini AI Dynamic Recovery</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn btn-outline btn-sm" id="hdr-reload-btn" title="Force Reload Latest App Version">🔄 Reload</button>
        <button class="btn btn-outline btn-sm" id="hdr-checkin-btn">⚡ Daily Check-in</button>
        <button class="btn btn-outline btn-sm" id="hdr-key-btn">🔑 Gemini Key</button>
        <button class="btn btn-outline btn-sm" id="hdr-ping-btn">🔔 Push Ping</button>
        <button class="btn btn-icon" id="hdr-profile-btn" aria-label="Profile">⚙️</button>
      </div>
    </header>

    <!-- Main Navigation Bar -->
    <nav class="app-nav glassmorphism">
      <button class="tab-btn active" data-tab="chat">
        <span class="nav-icon">💬</span>
        <span class="nav-label">Coach Chat</span>
      </button>
      <button class="tab-btn" data-tab="plan">
        <span class="nav-icon">🏋️</span>
        <span class="nav-label">Today's Plan</span>
      </button>
      <button class="tab-btn" data-tab="dashboard">
        <span class="nav-icon">📊</span>
        <span class="nav-label">Analytics</span>
      </button>
    </nav>

    <!-- Dynamic Main View Container -->
    <main id="main-view" class="main-content">
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Loading Adaptive Fitness Agent...</p>
      </div>
    </main>
  </div>

  <!-- Global Modal Container -->
  <div id="modal-container"></div>

  <!-- Application Entry Point -->
  <script type="module" src="js/app.js?v=5"></script>

  <script>
    // Force reload PWA cache buster handler
    document.getElementById('hdr-reload-btn')?.addEventListener('click', async () => {
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        for (let reg of registrations) {
          await reg.unregister();
        }
      }
      if ('caches' in window) {
        const keys = await caches.keys();
        for (let key of keys) {
          await caches.delete(key);
        }
      }
      window.location.reload(true);
    });
  </script>
</body>
</html>
